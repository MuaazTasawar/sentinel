name: CI

# Runs on Linux AND Windows on purpose: the audit-log crash-recovery bug found in
# development passed on Linux and failed on Windows (an append-only file handle
# cannot be truncated there). Platform-specific behaviour is a real risk here.

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # sentinel-cli links the PC/SC smart-card library for its (unverified)
      # YubiKey support; GitHub's Ubuntu image does not ship the dev package.
      # Windows and macOS use the operating system's own smart-card API.
      - name: Install PC/SC development files (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libpcsclite-dev

      # `cargo test` builds test executables, not the sentinel-node / sentinel-cli
      # binaries, so build everything explicitly.
      - name: Build everything
        run: cargo build --workspace --all-targets

      # --no-fail-fast: one failing crate must not hide failures in the rest.
      - name: Test
        run: cargo test --workspace --no-fail-fast

      # Guard: the server must stay buildable on a machine with no smart-card
      # stack. Only sentinel-cli (feature `yubikey`) may depend on it.
      - name: The server must not depend on PC/SC or the YubiKey crate
        if: runner.os == 'Linux'
        run: |
          if cargo tree -p sentinel-node -e normal --prefix none | grep -q -i -E 'pcsc|yubikey'; then
            echo "sentinel-node must not depend on the smart-card stack"; exit 1
          fi

  # A gate: the tree is formatted with rustfmt, so a diff never mixes real
  # changes with whitespace churn. Fix a failure locally with `cargo fmt --all`.
  fmt:
    name: rustfmt (must be formatted)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # NOT a gate yet (continue-on-error). macOS has never been built or tested by
  # the author, so a failure here is information, not a verdict. Once it has
  # been green for a while, delete `continue-on-error` to make it a gate.
  macos:
    name: build and test (macos-latest, non-blocking)
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace --no-fail-fast

  # NOT a gate yet. Cargo.toml declares rust-version = 1.87; this checks that a
  # 1.87 toolchain can really build the workspace (a dependency may need newer).
  # If it fails, either raise `rust-version` or pin the dependency.
  msrv:
    name: minimum Rust version 1.87 (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87
      - uses: Swatinem/rust-cache@v2
      - name: Install PC/SC development files (Linux)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libpcsclite-dev
      - run: cargo check --workspace --all-targets --locked

  clippy:
    name: clippy (warnings are errors)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # sentinel-cli links the PC/SC smart-card library for its (unverified)
      # YubiKey support; GitHub's Ubuntu image does not ship the dev package.
      # Windows and macOS use the operating system's own smart-card API.
      - name: Install PC/SC development files (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libpcsclite-dev

      - run: cargo clippy --workspace --all-targets -- -D warnings

  # NOT a gate (continue-on-error). Fuzzing needs nightly + libFuzzer and this
  # job has never been observed to run by the author. It is here so the targets
  # get exercised in CI instead of rotting; treat a failure as a lead to look
  # into, and a pass as encouraging rather than proof.
  fuzz-smoke:
    name: fuzz smoke test (nightly, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/crypto/fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz each target for 45 seconds
        working-directory: crates/crypto
        run: |
          for target in decrypt combine_shares kdf; do
            cargo +nightly fuzz run "$target" -- -max_total_time=45
          done