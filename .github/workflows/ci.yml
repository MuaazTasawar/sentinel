name: CI

# Runs on Linux AND Windows on purpose: the audit-log crash-recovery bug found in
# development passed on Linux and failed on Windows (an append-only file handle
# cannot be truncated there). Platform-specific behaviour is a real risk here.

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # `cargo test` builds test executables, not the sentinel-node / sentinel-cli
      # binaries, so build everything explicitly.
      - name: Build everything
        run: cargo build --workspace --all-targets

      # --no-fail-fast: one failing crate must not hide failures in the rest.
      - name: Test
        run: cargo test --workspace --no-fail-fast

  clippy:
    name: clippy (warnings are errors)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # NOT a gate (continue-on-error). Fuzzing needs nightly + libFuzzer and this
  # job has never been observed to run by the author. It is here so the targets
  # get exercised in CI instead of rotting; treat a failure as a lead to look
  # into, and a pass as encouraging rather than proof.
  fuzz-smoke:
    name: fuzz smoke test (nightly, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/crypto/fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz each target for 45 seconds
        working-directory: crates/crypto
        run: |
          for target in decrypt combine_shares kdf; do
            cargo +nightly fuzz run "$target" -- -max_total_time=45
          done