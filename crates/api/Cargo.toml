[package]
name = "sentinel-node"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
config = "0.15.25"
dotenvy = "0.15.7"
rustls = "0.23.43"
rustls-pemfile = "2.2.0"
sentinel-anomaly = { version = "0.1.0", path = "../anomaly" }
sentinel-audit = { version = "0.1.0", path = "../audit" }
sentinel-consensus = { version = "0.1.0", path = "../consensus" }
sentinel-crypto = { version = "0.1.0", path = "../crypto" }
sentinel-hardware = { version = "0.1.0", path = "../hardware" }
sentinel-storage = { version = "0.1.0", path = "../storage" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = "0.26.4"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
