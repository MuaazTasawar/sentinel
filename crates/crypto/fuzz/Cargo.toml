[package]
name = "sentinel-crypto-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.sentinel-crypto]
path = ".."

[[bin]]
name = "decrypt"
path = "fuzz_targets/decrypt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "combine_shares"
path = "fuzz_targets/combine_shares.rs"
test = false
doc = false
bench = false

[[bin]]
name = "kdf"
path = "fuzz_targets/kdf.rs"
test = false
doc = false
bench = false

# Deliberately isolated from the workspace at D:\Goooo\sentinel\Cargo.toml.
# Fuzz crates conventionally pin different (often nightly-only) versions
# of shared dependencies than the rest of the project, so they're kept
# out of the unified workspace resolution entirely -- this empty table
# is what tells Cargo "don't treat this as a member, and don't look for
# a workspace root above it."
[workspace]