[package]
name = "sentinel-crypto-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.sentinel-crypto]
path = ".."

[[bin]]
name = "decrypt"
path = "fuzz_targets/decrypt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "combine_shares"
path = "fuzz_targets/combine_shares.rs"
test = false
doc = false
bench = false

[[bin]]
name = "kdf"
path = "fuzz_targets/kdf.rs"
test = false
doc = false
bench = false