[package]
name = "sentinel-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bincode = "1.3"
clap = { version = "4.6.6", features = ["derive"] }
rpassword = "7.5.4"
sentinel-audit = { version = "0.1.0", path = "../audit" }
sentinel-crypto = { version = "0.1.0", path = "../crypto" }
sentinel-hardware = { version = "0.1.0", path = "../hardware" }
serde_json = "1.0.151"
yubikey = { version = "0.8", features = ["untested"] }

[dev-dependencies]
tempfile = "3.27.0"
