[package]
name = "sentinel-hardware"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["yubikey"]
# Hardware-key (YubiKey PIV) support. It pulls in the PC/SC smart-card stack
# (libpcsclite on Linux) and has never been run against a real device. The
# software quorum (`QuorumUnseal`) does not need it, so the server builds with
# `default-features = false`.
yubikey = ["dep:yubikey"]

[dependencies]
sentinel-crypto = { version = "0.1.0", path = "../crypto" }
thiserror = "2.0.20"
yubikey = { version = "0.8.0", features = ["untested"], optional = true }

[dev-dependencies]
rand = "0.8"