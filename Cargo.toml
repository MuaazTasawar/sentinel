[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/cli",
    "crates/crypto",
    "crates/storage",
    "crates/audit",
    "crates/hardware",
    "crates/consensus",
    "crates/anomaly",
    "crates/sim",
]

# Every member inherits these with `field.workspace = true`, so the
# edition, version and license can never drift between crates again.
[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
authors = ["MuaazTasawar"]
rust-version = "1.85"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "unwind"